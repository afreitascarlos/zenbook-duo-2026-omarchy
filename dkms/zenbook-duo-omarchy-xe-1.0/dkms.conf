# Omarchy's xe.ko + the Zenbook Duo UX8407AA eDP-2 fix (xe #9196). See build.sh.
PACKAGE_NAME="zenbook-duo-omarchy-xe"
PACKAGE_VERSION="1.0"
BUILD_EXCLUSIVE_KERNEL="^7\..*-omarchy$"
MAKE[0]="bash ./build.sh ${kernelver} ${kernel_source_dir}"
CLEAN="rm -rf src"
BUILT_MODULE_NAME[0]="xe"
BUILT_MODULE_LOCATION[0]="src/drivers/gpu/drm/xe/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
